[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "framing-llm-reproducibility"
version = "1.0.2"
description = "Reproducibility code for zero-shot frame detection with binary questions"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<3",
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
llm = [
  "torch>=2.2",
  "transformers>=4.40,<5",
  "accelerate>=0.27,<2",
  "huggingface-hub>=0.20",
  "tqdm>=4.65",
]
similarity = [
  "sentence-transformers>=3.0.1,<6",
]
all = [
  "torch>=2.2",
  "transformers>=4.40,<5",
  "accelerate>=0.27,<2",
  "huggingface-hub>=0.20",
  "tqdm>=4.65",
  "sentence-transformers>=3.0.1,<6",
]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
